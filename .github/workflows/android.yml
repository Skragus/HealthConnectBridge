name: Historical sync Android build
on:
  push:
    branches: [single-worker-sync]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon testProdDebugUnitTest assembleProdRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watchdogbridge-historical-build
          path: |
            app/build/outputs/apk/prod/release/*.apk
            app/build/reports/tests/testProdDebugUnitTest/
