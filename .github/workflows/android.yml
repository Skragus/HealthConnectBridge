name: Historical sync Android build
on:
  push:
    branches: [single-worker-sync]
  pull_request:
  workflow_dispatch:
concurrency:
  group: historical-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon testProdDebugUnitTest assembleProdRelease
      - name: Preserve package-matched unsigned releases
        run: |
          mkdir -p unsigned-releases
          cp app/build/outputs/apk/prod/release/*-unsigned.apk unsigned-releases/watchdogbridge-healthconnectbridge-unsigned.apk
          ./gradlew --no-daemon assembleProdRelease -PbridgeApplicationId=com.example.watchdogbridge
          cp app/build/outputs/apk/prod/release/*-unsigned.apk unsigned-releases/watchdogbridge-watchdogbridge-unsigned.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: watchdogbridge-historical-build
          path: |
            unsigned-releases/*.apk
            app/build/reports/tests/testProdDebugUnitTest/
